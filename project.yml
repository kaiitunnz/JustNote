name: JustNote
options:
  bundleIdPrefix: com.justnote
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"
    Release:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGNING_REQUIRED: "YES"
      CODE_SIGNING_ALLOWED: "YES"
      DEVELOPMENT_TEAM: "C62G6XUR78"

packages:
  MarkdownEngine:
    url: https://github.com/nodes-app/swift-markdown-engine.git
    # Pre-1.0 package: pin exactly so its editor behavior and API do not drift between checkouts.
    exactVersion: 0.10.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    # Exact-version pin (the .xcodeproj — and its Package.resolved — is git-ignored, so a
    # range would let checkouts drift). Verified to compile against the macOS 27 SDK.
    exactVersion: 1.9.4
  HighlighterSwift:
    url: https://github.com/smittytone/HighlighterSwift
    # Transitive dependency of MarkdownEngine's MarkdownEngineCodeBlocks product, which
    # MarkdownEngine pins only as a `from: 3.0.0` range. Pin it exactly here because the
    # .xcodeproj (and its Package.resolved) is git-ignored, so a range would let checkouts
    # drift. Verified to compile against the macOS 27 SDK.
    exactVersion: 3.1.0

schemes:
  JustNote:
    build:
      targets:
        JustNote: all
        JustNoteTests: [test]
    test:
      targets:
        - JustNoteTests

targets:
  JustNote:
    type: application
    platform: macOS
    sources:
      - Sources/JustNote
      - path: Resources/JustNote.icon
        type: file
    dependencies:
      - package: MarkdownEngine
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: JustNote
        PRODUCT_BUNDLE_IDENTIFIER: com.justnote.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: JustNote
        MACOSX_DEPLOYMENT_TARGET: "27.0"

  JustNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/JustNoteTests
    dependencies:
      - target: JustNote
      - package: MarkdownEngine
        product: MarkdownEngineCodeBlocks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justnote.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        MACOSX_DEPLOYMENT_TARGET: "27.0"
